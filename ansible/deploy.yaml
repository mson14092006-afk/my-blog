- name: Deploy Flask Blog to VPS
  hosts: vps # Group trong file inventory 
  become: true # Chạy các lệnh với quyền root (sudo)

  # Các biến được định nghĩa trong playbook
  vars: 
    app_dir: /opt/my-blog # Thư mục chứa ứng dụng Blog trên VPS
    docker_image: ghcr.io/mson14092006-afk/my-blog:latest

  tasks:
    - name: Install Docker
      apt:
        name: # sudo apt install docker.io docker-compose
        - docker.io 
        - docker-compose-v2 # Docker-compose v2 (docker compose) thay vì v1 (docker-compose)
        state: present
        update_cache: true # sudo apt update
        cache_valid_time: 3600 # Nếu apt update đã được chạy trong vòng 1 giờ trước đó thì không chạy lại

    - name: Ensure app directory
      file:
        path: "{{ app_dir }}" # /opt/my-blog
        state: directory # đảm bảo thư mục tồn tạo (mkdir -p /opt/my-blog nếu chưa tồn tại, nếu đã tồn tại thì không làm gì)
        mode: "0755" #  sudo chmod 755 /opt/my-blog
    
    - name: Add exporter to docker group
      user:
        name: exporter
        groups: docker # Set group của user exporter là docker
        append: yes # sudo usermod -aG docker exporter
  
    - name: Generate .env
      template:
        src: templates/env.j2 # Truyền các biến môi trường từ Ansible vào file .env trên VPS
        dest: "{{ app_dir }}/.env"
        mode: "0640" # Set quyền read cho exporter 

    - name: Copy docker-compose
      copy: # đảm bảo docker-compose.prod.yaml đã tồn tại trên VPS
        src: ../docker-compose.prod.yaml
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Pull latest image
      community.docker.docker_image: # pull the latest image from GitHub Container Registry
        name: "{{ docker_image }}"
        source: pull

    - name: Start services
      community.docker.docker_compose_v2: # cd /opt/my-blog && sudo docker-compose up -d
        project_src: "{{ app_dir }}"
        state: present
        recreate: always # luôn recreate container để tránh chạy container cũ 
    
    - name: Run Database Migrations
      community.docker.docker_container_exec:
        container: app # Tên service/container chạy Flask app (định nghĩa trong docker-compose.yml)
        command: flask db upgrade

    - name: Install Nginx
      apt:
        name: [nginx] 
        state: present

    - name: Configure Nginx reverse proxy
      template:
        src: templates/nginx.conf.j2 
        dest: /etc/nginx/sites-available/my-blog 
      notify: reload nginx # Nếu thay đổi Nginx reverse proxy config, handler reload nginx sẽ được thực hiện ở cuối playbook

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/my-blog # site-available: chứa các file cấu hình của các website
        dest: /etc/nginx/sites-enabled/my-blog # site-enabled: chứa các file cấu hình của các website được kích hoạt
        state: link # Symbolic link /etc/nginx/sites-available/my-blog -> /etc/nginx/sites-enabled/my-blog (kích hoạt các file cấu hình)

  #   - name: Issue SSL cert (Let's Encrypt)
  #     command: > # Triển khai certbot để xin chứng chỉ SSL miễn phí từ Let's Encrypt và cấu hình Nginx tự động
  #       certbot --nginx -d {{ domain }} --non-interactive
  #       --agree-tos -m mson14092006@gmail.com 
  #     args: #
  #       creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem # Nếu file fullchain.pem đã tồn tại, lệnh certbot sẽ không được thực thi lại
  handlers: # Nếu thay đổi Nginx reverse proxy config, handler reload nginx sẽ được gọi để reload Nginx
    - name: reload nginx
      service:
        name: nginx
        state: reloaded
